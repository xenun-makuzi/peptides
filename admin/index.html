<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Peptides | Product Management CMS</title>
    
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Login Screen (shown until an authenticated session is confirmed) -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-brand">
                <i data-lucide="shield-check" class="brand-icon"></i>
                <h1>Australian Peptides</h1>
                <span>Admin Login</span>
            </div>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" placeholder="admin@example.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="btn-save"><i data-lucide="log-in"></i> Sign In</button>

                <div id="loginMessage" class="status-message"></div>
            </form>
        </div>
    </div>

    <!-- CMS App (hidden until authenticated) -->
    <div id="cmsApp" style="display: none;">

        <!-- CMS Navigation Header -->
        <header class="cms-header">
            <div class="header-brand">
                <i data-lucide="shield-check" class="brand-icon"></i>
                <div>
                    <h1>Australian Peptides</h1>
                    <span>Content Management System</span>
                </div>
            </div>

            <nav class="cms-nav-links">
                <a href="../index.html" class="nav-btn"><i data-lucide="home"></i> Home</a>
                <a href="../products.html" class="nav-btn"><i data-lucide="package"></i> Catalog</a>
                <a href="../index.html" class="view-site-btn" target="_blank">
                    <i data-lucide="external-link"></i> Live Website
                </a>
                <button type="button" id="logoutBtn" class="nav-btn"><i data-lucide="log-out"></i> Logout</button>
            </nav>
        </header>

        <div class="cms-layout">
            <main class="cms-container">
                <!-- Left Side: Product Form -->
                <section class="form-card">
                    <div class="card-header">
                        <h2 id="formTitle"><i data-lucide="plus-circle"></i> Add New Product</h2>
                        <button type="button" id="cancelEditBtn" class="cancel-btn" style="display: none;">Cancel Edit</button>
                    </div>

                    <form id="productForm" onsubmit="return false;">
                        <input id="productId" type="hidden">

                        <div class="form-group">
                            <label for="productNameInput">Product Name</label>
                            <input id="productNameInput" type="text" placeholder="e.g. BPC-157 5mg" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="priceInput">Price ($)</label>
                                <input id="priceInput" type="number" step="0.01" placeholder="49.99" required>
                            </div>

                            <div class="form-group">
                                <label for="categorySelect">Category</label>
                                <select id="categorySelect">
                                    <option value="peptides">Peptides</option>
                                    <option value="liquids">Liquids</option>
                                    <option value="powder">Powders</option>
                                    <option value="research">Research Compounds</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descriptionInput">Product Description</label>
                            <textarea id="descriptionInput" placeholder="Enter full compound details, research specs..."></textarea>
                        </div>

                        <!-- Dual Image Upload Section -->
                        <div class="form-row">
                            <div class="form-group file-group">
                                <label for="productImage"><i data-lucide="image"></i> Product Image</label>
                                <input type="file" id="productImage" accept="image/*">
                            </div>

                            <div class="form-group file-group">
                                <label for="labImage"><i data-lucide="file-text"></i> Lab Test Image (COA)</label>
                                <input type="file" id="labImage" accept="image/*">
                            </div>
                        </div>

                        <!-- Visibility Tags -->
                        <label class="section-label">Badges & Visibility</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-card">
                                <input type="checkbox" id="featured">
                                <span>Featured Product</span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" id="newArrival">
                                <span>New Arrival</span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" id="bestSeller">
                                <span>Best Seller</span>
                            </label>
                        </div>

                        <!-- Action Bar -->
                        <div class="form-actions">
                            <button type="button" id="saveBtn" class="btn-save">
                                <i data-lucide="save"></i> Save Product
                            </button>
                        </div>

                        <div id="message" class="status-message"></div>
                    </form>
                </section>

                <!-- Right Side: Catalog List -->
                <section class="list-card">
                    <div class="card-header">
                        <h2><i data-lucide="boxes"></i> Product Inventory</h2>
                        <span id="productCountBadge" class="count-badge">0 items</span>
                    </div>

                    <div id="productsList" class="products-list-container">
                        <div class="loading-state">
                            <i data-lucide="loader" class="spin"></i>
                            <p>Fetching catalog from database...</p>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>

</html>
